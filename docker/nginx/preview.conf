# The preview (`make preview`): the built app and Laravel on one address,
# port 8080, routed as in production.

map $sent_http_content_type $fichaje_csp {
    ~*^text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com";
    default "";
}

server {
    listen 8080;
    server_name _;

    root /var/www/web/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $fichaje_csp always;

    # Laravel: the API, Sanctum's CSRF cookie, the Stripe webhook (under
    # /api) and the /up health check.
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /nonexistent @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120;
    }

    # Vite fingerprints everything under /assets: cache it for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other path is the app (its router answers unknown ones with its
    # own "page not found"). index.html is never cached.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
