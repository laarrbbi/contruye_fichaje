services:
  php:
    build:
      context: ./docker/php
    container_name: fichaje-php
    # Runs as you: what the app or composer writes stays yours. On Linux, if
    # `id -u` is not 1000, put UID=... and GID=... in a .env next to this file
    # (`make setup` does).
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fichaje

  nginx:
    image: nginx:1.27-alpine
    container_name: fichaje-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - fichaje

  # The whole site on one address, as visitors get it: `make preview`.
  preview:
    image: nginx:1.27-alpine
    container_name: fichaje-preview
    profiles: ["preview"]
    ports:
      - "8080:8080"
    volumes:
      - ./web/dist:/var/www/web/dist:ro
      - ./docker/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - fichaje

  mysql:
    image: mysql:8.0
    container_name: fichaje-mysql
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: fichaje
      MYSQL_USER: fichaje
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - fichaje

  # The notification e-mails (new applicant, chat opened) are queued.
  queue:
    build:
      context: ./docker/php
    container_name: fichaje-queue
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/api
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./api:/var/www/api
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fichaje

volumes:
  mysql-data:

networks:
  fichaje:
    driver: bridge
